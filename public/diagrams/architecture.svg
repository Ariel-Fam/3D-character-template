<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1580" width="1800" height="1580" role="img" aria-labelledby="title desc"><title id="title">Character control template architecture</title><desc id="desc">App shell, keyboard and mouse input, shared simulation refs, movement physics, animation, camera follow, rendering, configuration, and verification.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#4b789a" stroke-width="1.7"/></marker></defs><rect width="1800" height="1580" fill="#ffffff"/><text x="40" y="68" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#123956"><tspan x="40" dy="0">Character controller / architecture</tspan></text>
<text x="40" y="106" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5a768c"><tspan x="40" dy="0">A reusable Next.js + React Three Fiber template, from input to pixels</tspan></text>
<rect x="40" y="135" width="1710" height="90" rx="14" fill="#f0f4f8" stroke="#7695b1" stroke-width="2"/>
<text x="62" y="176" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="62" dy="0">Project boundary</tspan></text>
<text x="62" y="213" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="62" dy="0">Astro Runner root → character-controller-template/  ·  Standalone package, lockfile, tests, and local model copy; no runtime imports from the parent game.</tspan></text>
<rect x="650" y="270" width="500" height="160" rx="14" fill="#e4f3ff" stroke="#7695b1" stroke-width="2"/>
<text x="672" y="311" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="672" dy="0">01  App shell</tspan></text>
<text x="672" y="348" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="672" dy="0">app/layout.tsx → app/page.tsx</tspan><tspan x="672" dy="24.3">components/Playground.tsx</tspan><tspan x="672" dy="24.3">Canvas, shared refs, blue scene + toolbar</tspan></text>
<rect x="40" y="500" width="450" height="170" rx="14" fill="#eaf7ef" stroke="#80a98f" stroke-width="2"/>
<text x="62" y="541" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="62" dy="0">02  Keyboard input</tspan></text>
<text x="62" y="578" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="62" dy="0">controls/character/useKeyboard.ts</tspan><tspan x="62" dy="24.3">WASD + arrows, Shift, Space, B, R</tspan><tspan x="62" dy="24.3">Held keys + one-shot actions</tspan><tspan x="62" dy="24.3">Clear input on blur / hidden tab</tspan></text>
<rect x="650" y="500" width="500" height="170" rx="14" fill="#f0edff" stroke="#998bc0" stroke-width="2"/>
<text x="672" y="541" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="672" dy="0">03  Shared simulation refs</tspan></text>
<text x="672" y="578" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="672" dy="0">CharacterState: pose, velocity, jumps, epoch</tspan><tspan x="672" dy="24.3">CameraState: yaw, pitch, distance, snap</tspan><tspan x="672" dy="24.3">Created once by Playground via useRef</tspan><tspan x="672" dy="24.3">Per-frame updates avoid React re-renders</tspan></text>
<rect x="1300" y="500" width="450" height="170" rx="14" fill="#eaf7ef" stroke="#80a98f" stroke-width="2"/>
<text x="1322" y="541" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="1322" dy="0">04  Mouse + browser capture</tspan></text>
<text x="1322" y="578" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="1322" dy="0">controls/camera/useCameraInput.ts</tspan><tspan x="1322" dy="24.3">useMouseLock.ts tracks lock UI / errors</tspan><tspan x="1322" dy="24.3">Click: capture · Escape: release</tspan><tspan x="1322" dy="24.3">Mouse-look / drag orbit / wheel zoom</tspan></text>
<rect x="650" y="790" width="500" height="170" rx="14" fill="#fff2dd" stroke="#bd9a60" stroke-width="2"/>
<text x="672" y="831" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="672" dy="0">05  Character controller</tspan></text>
<text x="672" y="868" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="672" dy="0">CharacterController.tsx → physics.ts</tspan><tspan x="672" dy="24.3">useFrame(-1): camera-relative movement</tspan><tspan x="672" dy="24.3">Acceleration, gravity, double jump, backflip</tspan><tspan x="672" dy="24.3">Writes pose + animation intent; R resets refs</tspan></text>
<rect x="1300" y="790" width="450" height="170" rx="14" fill="#e4f3ff" stroke="#7695b1" stroke-width="2"/>
<text x="1322" y="831" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="1322" dy="0">06  Third-person camera</tspan></text>
<text x="1322" y="868" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="1322" dy="0">ThirdPersonCamera.tsx + config.ts</tspan><tspan x="1322" dy="24.3">Reads character pose + orbit ref</tspan><tspan x="1322" dy="24.3">Smooth follow; bounded pitch + zoom</tspan><tspan x="1322" dy="24.3">useFrame(0): position camera, lookAt target</tspan></text>
<rect x="40" y="1070" width="450" height="190" rx="14" fill="#f0f4f8" stroke="#7695b1" stroke-width="2"/>
<text x="62" y="1111" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="62" dy="0">07  Local character asset</tspan></text>
<text x="62" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="62" dy="0">public/models/6animations.glb</tspan><tspan x="62" dy="24.3">Six clips + embedded textures</tspan><tspan x="62" dy="24.3">modelUtils.ts: clone skeleton / materials</tspan><tspan x="62" dy="24.3">Normalize to 1.85m; dispose cloned data</tspan></text>
<rect x="650" y="1070" width="500" height="190" rx="14" fill="#fff2dd" stroke="#bd9a60" stroke-width="2"/>
<text x="672" y="1111" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="672" dy="0">08  Animated character</tspan></text>
<text x="672" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="672" dy="0">CharacterModel.tsx · useGLTF / useAnimations</tspan><tspan x="672" dy="24.3">config.ts maps intent to clip names</tspan><tspan x="672" dy="24.3">Idle_3 · Walking · Running</tspan><tspan x="672" dy="24.3">Regular_Jump · Fall2 · Backflip</tspan><tspan x="672" dy="24.3">Crossfades, one-shot replay, shared assets</tspan></text>
<rect x="1300" y="1070" width="450" height="190" rx="14" fill="#e4f3ff" stroke="#7695b1" stroke-width="2"/>
<text x="1322" y="1111" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="1322" dy="0">09  Scene → pixels</tspan></text>
<text x="1322" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="1322" dy="0">React Three Fiber → Three.js → WebGL</tspan><tspan x="1322" dy="24.3">Blue 2,000m plane + sky-blue background</tspan><tspan x="1322" dy="24.3">Hemisphere + directional light, shadows</tspan><tspan x="1322" dy="24.3">Flat ground physics: Y = 0</tspan></text>
<polyline points="900,237 900,258" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<polyline points="900,442 900,488" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="920" y="469" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="920" dy="0">owns state</tspan></text>
<polyline points="502,585 565,585 565,875 638,875" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="355" y="738" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="355" dy="0">movement intent</tspan></text>
<polyline points="900,682 900,778" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="920" y="732" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="920" dy="0">read + update</tspan></text>
<polyline points="1162,585 1230,585 1230,875 1288,875" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1155" y="734" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="1155" dy="0">pose / orbit</tspan></text>
<polyline points="1525,682 1525,778" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1545" y="732" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="1545" dy="0">camera input</tspan></text>
<polyline points="900,972 900,1058" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="920" y="1017" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="920" dy="0">motion + epoch</tspan></text>
<polyline points="502,1160 638,1160" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="550" y="1136" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="550" dy="0">load</tspan></text>
<polyline points="1525,972 1525,1058" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1545" y="1017" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="1545" dy="0">view</tspan></text>
<polyline points="1162,1160 1288,1160" fill="none" stroke="#4b789a" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1200" y="1136" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#486c86"><tspan x="1200" dy="0">draw</tspan></text>
<text x="40" y="1304" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#29465f"><tspan x="40" dy="0">Frame order: input events → movement / physics (-1) → animation + camera (0) → WebGL render.   UI state changes only for loading and mouse capture.</tspan></text>
<rect x="40" y="1360" width="820" height="150" rx="14" fill="#f0f4f8" stroke="#7695b1" stroke-width="2"/>
<text x="62" y="1401" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="62" dy="0">Tune or replace</tspan></text>
<text x="62" y="1438" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="62" dy="0">controls/character/config.ts: model path, clip names, speeds, gravity, jumps</tspan><tspan x="62" dy="24.3">controls/camera/config.ts: follow speed, pitch limits, zoom limits, sensitivity</tspan><tspan x="62" dy="24.3">Replace the environment in Playground; add collision logic in physics.ts.</tspan></text>
<rect x="910" y="1360" width="840" height="150" rx="14" fill="#f0f4f8" stroke="#7695b1" stroke-width="2"/>
<text x="932" y="1401" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#173c5b"><tspan x="932" dy="0">Verify and run</tspan></text>
<text x="932" y="1438" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#35546b"><tspan x="932" dy="0">tests/controller.test.mjs: normalized movement, camera yaw, double jump, clips</tspan><tspan x="932" dy="24.3">npm test · npm run typecheck · npm run lint · npm run build</tspan><tspan x="932" dy="24.3">npm run dev → localhost:3002   |   Parent game stays on its own port.</tspan></text>
<text x="40" y="1557" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#698297"><tspan x="40" dy="0">Solid arrows: runtime flow   ·   Pastel cards: module responsibilities   ·   Generated from the actual template structure</tspan></text></svg>